title: CreditRiskScoringInstance
type: object
required:
  - loan_id
  - borrower_id
  - feature_date
  - feature_version
  - annual_income
  - employment_years
  - credit_score
  - existing_debt
  - home_ownership
  - loan_amount
  - loan_term_months
  - interest_rate
  - loan_purpose
  - debt_to_income
  - loan_to_income
  - estimated_monthly_payment
  - payment_to_income
  - credit_score_band
  - employment_stability
properties:
  loan_id: {type: string}
  borrower_id: {type: string}
  feature_date: {type: string, format: date}
