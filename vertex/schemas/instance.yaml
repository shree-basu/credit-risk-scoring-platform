  annual_income: {type: number}
  employment_years: {type: integer}
  credit_score: {type: integer}
  existing_debt: {type: number}
  home_ownership: {type: string}
  loan_amount: {type: number}
  loan_term_months: {type: integer}
  interest_rate: {type: number}
  loan_purpose: {type: string}
  debt_to_income: {type: number}
  loan_to_income: {type: number}
  estimated_monthly_payment: {type: number}
  payment_to_income: {type: number}
  credit_score_band: {type: string}
  employment_stability: {type: string}
